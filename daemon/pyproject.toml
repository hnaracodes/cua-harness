[project]
name = "oversight"
version = "0.1.0"
description = "Sketch Oversight daemon: planner, scorer, approval, executor, store"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2",
    "pyyaml>=6.0",
    "anthropic>=1.11",
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pillow>=10.3",
    "keyring>=25.0",
    "python-multipart>=0.0.9",
    "peripheral",
]

[project.scripts]
oversight-daemon = "oversight.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-timeout>=2.3"]
packaging = ["pyinstaller>=6.10"]

[tool.uv.sources]
peripheral = { path = "../../testing", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oversight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
