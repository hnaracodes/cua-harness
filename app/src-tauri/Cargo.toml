[package]
name = "agent-oversight"
version = "0.1.0"
description = "Sketch Oversight replica: Agent Oversight desktop shell"
edition = "2021"

[lib]
name = "agent_oversight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
